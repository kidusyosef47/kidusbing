<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addis Bingo MiniApp</title>
<style>
  body { font-family: sans-serif; text-align:center; background:#f9f9f9; }
  table { margin:auto; border-collapse: collapse; margin-top:20px; }
  td { width:50px; height:50px; border:1px solid #333; text-align:center; vertical-align:middle; font-weight:bold; cursor:pointer; }
  .marked { background-color: #4caf50; color:white; }
  #bingoBtn { margin-top: 20px; padding: 10px 20px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<h2>Addis Bingo 🎱</h2>
<div id="timer">Select your card! Game starts in <span id="count">30</span>s</div>
<table id="bingo-card"></table>
<button id="bingoBtn">Bingo!</button>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

let countdown = 30;
let playerCard = [];
let marked = [];
let cardPicked = false;

const timerEl = document.getElementById("count");
const bingoCardEl = document.getElementById("bingo-card");

// ---------------- Countdown ----------------
const interval = setInterval(() => {
  countdown--;
  timerEl.textContent = countdown;
  if(countdown <= 0){
    clearInterval(interval);
    if(!cardPicked){
      tg.sendData(JSON.stringify({action:"pick_card"}));
      cardPicked = true;
    }
  }
},1000);

// ---------------- Render Card ----------------
function renderCard(){
  bingoCardEl.innerHTML = '';
  for(let i=0;i<5;i++){
    const row = document.createElement('tr');
    for(let j=0;j<5;j++){
      const td = document.createElement('td');
      const val = playerCard[i*5+j];
      td.textContent = val;
      if(marked.includes(val) || val==='FREE') td.classList.add('marked');
      row.appendChild(td);
    }
    bingoCardEl.appendChild(row);
  }
}

// ---------------- Bingo Button ----------------
document.getElementById('bingoBtn').addEventListener('click',()=>{
  if(!cardPicked) return alert("Pick a card first!");
  tg.sendData(JSON.stringify({action:"bingo"}));
});

// ---------------- Mark Numbers ----------------
function markNumber(number){
  if(playerCard.includes(number) && !marked.includes(number)){
    marked.push(number);
    renderCard();
  }
}

// ---------------- Bot Messages (numbers drawn) ----------------
window.Telegram.WebApp.onEvent('messageReceived', function(message){
  if(message.text.startsWith("🎯 Number drawn:")){
    const number = message.text.split(":")[1].trim();
    markNumber(number);
  }
});
</script>
</body>
</html>
