<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addis Bingo MiniApp</title>
<style>
  body { font-family: sans-serif; background: #f9f9f9; text-align:center; }
  h2 { margin-top: 20px; }
  .card-grid { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .card { border:1px solid #333; margin:5px; padding:10px; cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-weight:bold; background:white; }
  .card.selected { border: 3px solid #4caf50; background:#d4edda; }
  table { border-collapse: collapse; margin:auto; margin-top:20px; display:none; }
  td { border:1px solid #333; width:50px; height:50px; text-align:center; vertical-align:middle; font-weight:bold; cursor:pointer; }
  .marked { background-color:#4caf50; color:white; }
  #bingoBtn { margin-top:20px; padding:10px 20px; font-size:16px; cursor:pointer; display:none; }
  #countdown { font-size:18px; margin-top:10px; color:#d9534f; }
</style>
</head>
<body>

<h2>Addis Bingo 🎱</h2>
<p>Select a card number to play:</p>
<div id="countdown"></div>
<div class="card-grid" id="cardsContainer"></div>

<table id="bingo-card"></table>
<button id="bingoBtn">Bingo!</button>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

let playerCard = [];
let marked = [];
let cardPicked = false;
let gameStarted = false;

const cardsContainer = document.getElementById("cardsContainer");
const bingoCardEl = document.getElementById("bingo-card");
const bingoBtn = document.getElementById("bingoBtn");
const countdownEl = document.getElementById("countdown");

// ---------------- Display 100 card numbers ----------------
for(let i=1;i<=100;i++){
    const div = document.createElement('div');
    div.classList.add('card');
    div.textContent = i;
    div.addEventListener('click', ()=>{
        if(gameStarted) return; // can't change after countdown
        cardPicked = true;
        document.querySelectorAll('.card').forEach(el=>el.classList.remove('selected'));
        div.classList.add('selected');

        // Send card selection to bot
        tg.sendData(JSON.stringify({action:"pick_card", card_index:i}));

        // Show the bingo board placeholder
        bingoCardEl.style.display = 'table';
        bingoBtn.style.display = 'inline-block';
    });
    cardsContainer.appendChild(div);
}

// ---------------- Render Chosen Card ----------------
function renderCard(numbers){
    bingoCardEl.innerHTML = '';
    for(let i=0;i<5;i++){
        const row = document.createElement('tr');
        for(let j=0;j<5;j++){
            const td = document.createElement('td');
            const val = numbers[i*5+j];
            td.textContent = val;
            if(marked.includes(val) || val==='FREE') td.classList.add('marked');
            row.appendChild(td);
        }
        bingoCardEl.appendChild(row);
    }
}

// ---------------- Listen for bot messages ----------------
window.Telegram.WebApp.onEvent('messageReceived', function(message){
    // Countdown messages
    if(message.text.startsWith("⏳ Game starts in")){
        countdownEl.textContent = message.text;
        if(message.text.includes("0s")){
            gameStarted = true; // lock card selection
            countdownEl.textContent = "🎮 Game Started!";
        }
    }

    // Assigned card numbers
    if(message.text.startsWith("✅ Card #")){
        const nums = message.text.split("Numbers:")[1];
        if(nums){
            playerCard = nums.trim().split(",");
            renderCard(playerCard);
        }
    }

    // Drawn number updates
    if(message.text.startsWith("🎯 Number drawn:")){
        const number = message.text.split(":")[1].trim();
        if(!marked.includes(number)) marked.push(number);
        renderCard(playerCard);
    }
});

// ---------------- Bingo Button ----------------
bingoBtn.addEventListener('click', ()=>{
    if(!cardPicked) return alert("Pick a card first!");
    tg.sendData(JSON.stringify({action:"bingo"}));
});
</script>
</body>
</html>
